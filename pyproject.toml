[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bf-price-hunter"
version = "0.1.0"
description = "Async Black Friday Chile price monitor & extreme discount / price error alert bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "curl-cffi>=0.7.4,<1.0.0",
    "playwright>=1.50.0,<2.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.3.0,<6.0.0",
    "APScheduler>=3.11.0,<4.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "PyYAML>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["config*", "db*", "analyzer*", "notifier*", "scrapers*", "scheduler*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
